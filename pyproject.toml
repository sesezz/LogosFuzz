[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logosfuzz"
version = "0.1.0"
description = "LLM 기반 자동차 오픈소스 특화 퍼저 - EXE 파트 (격리 퍼징 실행)"
requires-python = ">=3.10"
authors = [{ name = "sesezz" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
logosfuzz = "logosfuzz.cli:main"

[tool.setuptools]
packages = [
    "logosfuzz",
    "logosfuzz.common",
    "logosfuzz.control",
    "logosfuzz.control.hitl",
    "logosfuzz.execute",
    "logosfuzz.generate",
]

[tool.pytest.ini_options]
# testpaths 를 고정하지 않는다. 목록을 두면 새 파트가 테스트 폴더를 추가할
# 때마다 여기에 등록해야 하고, 빠뜨리면 CI 가 조용히 건너뛴다(실제로 세 번
# 발생했다). norecursedirs 기본값이 .venv/build/dist 를 이미 제외하므로
# 저장소 전체를 훑어도 안전하다.
pythonpath = [".", "ana_05_02_cve_reporting"]
