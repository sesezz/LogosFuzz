[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logosfuzz"
version = "0.1.0"
description = "LLM 기반 C/C++ 임베디드 범용(자동차 프로필 포함) 퍼징 하네스 자동 생성 퍼저"
requires-python = ">=3.10"
authors = [{ name = "sesezz" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
logosfuzz = "logosfuzz.cli:main"

# 패키지 목록 미고정 (새 서브패키지 누락 방지), 테스트 패키지는 배포본에서 제외
[tool.setuptools.packages.find]
include = ["logosfuzz*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
# testpaths 미고정 (새 테스트 폴더 누락 방지)
# norecursedirs 기본값이 .venv/build/dist 를 제외하므로 전체 탐색 안전
pythonpath = ["."]
